<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The best day countdown</title>
    <style>
        /* Center everything on a clean white screen */
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #333333;
        }

        /* Container for the timer display */
        #countdown {
            font-size: 3rem;
            font-weight: bold;
            line-height: 0.5rem;
            text-align: center;
            letter-spacing: -1px;
        }
        .flexx {
          display: flex;
          flex-direction: column;
        }
    </style>
</head>
<body>
    <div class="flexx">
      <h1>Timer for the best day...</h1>
      <p id="countdown">Loading...</p>
    </div>

    <script>
        // Set the target date and time (September 15, 2026, 16:00:00)
        const targetDate = new Date("2026-09-15T16:00:00").getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const difference = targetDate - now;

            // If the countdown is finished, display a message and stop the timer
            if (difference < 0) {
                document.getElementById("countdown").innerHTML = "The time has arrived!";
                clearInterval(timerInterval);
                return;
            }

            // Time calculations for days, hours, and minutes
            const days = Math.floor(difference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((difference % (1000 * 60)) / 1000);

            // Format the string layout
            document.getElementById("countdown").innerHTML = 
                `${days}d ${hours}h ${minutes}m ${seconds}s`;
        }

        // Run the timer immediately on load
        updateCountdown();
        
        // Update the timer every second (1000 milliseconds)
        const timerInterval = setInterval(updateCountdown, 1000);
    </script>

</body>
</html>
